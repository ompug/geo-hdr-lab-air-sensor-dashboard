<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Apollo AIR-1 Research Network</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">UNC Charlotte · Air Quality Research</p>
        <h1>Apollo AIR-1 Sensor Network</h1>
      </div>
      <div id="network-status" class="network-status">Connecting…</div>
    </header>

    <main>
      <section id="overview">
        <div class="toolbar">
          <label class="search">
            <span>Search sensors</span>
            <input id="search" type="search" placeholder="Name or hostname">
          </label>
          <label>
            <span>Visible metric</span>
            <select id="metric-filter">
              <option value="all">All metrics</option>
              <option value="co2">CO₂</option>
              <option value="pm2_5">PM2.5</option>
              <option value="voc">VOC</option>
              <option value="temperature">Temperature</option>
              <option value="humidity">Humidity</option>
              <option value="pressure">Pressure</option>
              <option value="rssi">RSSI</option>
            </select>
          </label>
        </div>
        <div id="sensor-grid" class="sensor-grid" aria-live="polite"></div>
      </section>

      <section id="detail" class="detail" hidden>
        <button id="back" class="text-button">← All sensors</button>
        <div class="detail-heading">
          <div>
            <p id="detail-hostname" class="eyebrow"></p>
            <h2 id="detail-name"></h2>
          </div>
          <div id="detail-state"></div>
        </div>
        <div id="detail-metrics" class="detail-metrics"></div>
        <div class="chart-panel">
          <div class="chart-toolbar">
            <label>
              <span>Metric</span>
              <select id="chart-metric"></select>
            </label>
            <label>
              <span>Time range</span>
              <select id="chart-range">
                <option value="1">1 hour</option>
                <option value="6">6 hours</option>
                <option value="24" selected>24 hours</option>
                <option value="168">7 days</option>
                <option value="720">30 days</option>
              </select>
            </label>
          </div>
          <div class="chart-wrap">
            <canvas id="history-chart"></canvas>
            <p id="chart-empty" class="empty" hidden>No readings in this time range.</p>
          </div>
        </div>
        <dl id="detail-metadata" class="metadata"></dl>
      </section>
    </main>

    <footer>Values are collected directly from each sensor’s ESPHome HTTP API.</footer>
    <script src="/static/app.js" defer></script>
  </body>
</html>
